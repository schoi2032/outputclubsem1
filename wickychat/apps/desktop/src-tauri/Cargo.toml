[package]
name = "wickychat-desktop"
version = "0.1.0"
description = "WickyChat for macOS, Windows and Linux"
authors = ["Output Club"]
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "wickychat"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
